# ──────────────────────────────────────────────
# Queries SQL para alertas de eventos DIAN
#
# Consultas que detectan facturas sin eventos DIAN requeridos
# y facturas que recibieron evento de rechazo (reclamo).
#
# Solo aplica para facturas con forma_pago diferente a 'Contado'.
# El campo eventos_dian_notif contiene los códigos concatenados
# (ej: "030, 032, 033") y se llena mediante trigger.
#
# Códigos de eventos DIAN:
#   030 = Acuse de recibo de Factura Electrónica de Venta
#   031 = Reclamo de la Factura Electrónica de Venta (rechazo)
#   032 = Recibo del bien o prestación del servicio
#   033 = Aceptación expresa
# ──────────────────────────────────────────────

alertas_dian:

  # Facturas que NO han recibido el evento DIAN 030 (Acuse de recibo)
  # Agrupadas por año y mes de fecha_generacion de la factura.
  sin_evento_030: >
    SELECT
      EXTRACT(YEAR FROM f.fecha_generacion)::INT AS anio,
      EXTRACT(MONTH FROM f.fecha_generacion)::INT AS mes,
      COUNT(*) AS cantidad
    FROM facturacion.factura f
    JOIN facturacion.factura_control fc ON f.id_factura = fc.id_factura
    JOIN facturacion.pago_factura pf ON f.id_factura = pf.id_factura
    WHERE pf.codigo_forma_pago != '1'
      AND f.fecha_generacion < %s
      AND (fc.eventos_dian_notif IS NULL OR fc.eventos_dian_notif NOT LIKE '%%030%%')
    GROUP BY anio, mes
    ORDER BY anio DESC, mes DESC

  # Facturas que NO han recibido el evento DIAN 032 (Recibo del bien)
  # Agrupadas por año y mes de fecha_generacion de la factura.
  sin_evento_032: >
    SELECT
      EXTRACT(YEAR FROM f.fecha_generacion)::INT AS anio,
      EXTRACT(MONTH FROM f.fecha_generacion)::INT AS mes,
      COUNT(*) AS cantidad
    FROM facturacion.factura f
    JOIN facturacion.factura_control fc ON f.id_factura = fc.id_factura
    JOIN facturacion.pago_factura pf ON f.id_factura = pf.id_factura
    WHERE pf.codigo_forma_pago != '1'
      AND f.fecha_generacion < %s
      AND (fc.eventos_dian_notif IS NULL OR fc.eventos_dian_notif NOT LIKE '%%032%%')
    GROUP BY anio, mes
    ORDER BY anio DESC, mes DESC

  # Facturas que NO han recibido el evento DIAN 033 (Aceptación expresa)
  # Agrupadas por año y mes de fecha_generacion de la factura.
  sin_evento_033: >
    SELECT
      EXTRACT(YEAR FROM f.fecha_generacion)::INT AS anio,
      EXTRACT(MONTH FROM f.fecha_generacion)::INT AS mes,
      COUNT(*) AS cantidad
    FROM facturacion.factura f
    JOIN facturacion.factura_control fc ON f.id_factura = fc.id_factura
    JOIN facturacion.pago_factura pf ON f.id_factura = pf.id_factura
    WHERE pf.codigo_forma_pago != '1'
      AND f.fecha_generacion < %s
      AND (fc.eventos_dian_notif IS NULL OR fc.eventos_dian_notif NOT LIKE '%%033%%')
    GROUP BY anio, mes
    ORDER BY anio DESC, mes DESC

  # Facturas que HAN recibido el evento DIAN de rechazo/reclamo (031)
  # Agrupadas por año y mes de fecha_generacion de la factura.
  con_evento_rechazo: >
    SELECT
      EXTRACT(YEAR FROM f.fecha_generacion)::INT AS anio,
      EXTRACT(MONTH FROM f.fecha_generacion)::INT AS mes,
      COUNT(*) AS cantidad
    FROM facturacion.factura f
    JOIN facturacion.factura_control fc ON f.id_factura = fc.id_factura
    JOIN facturacion.pago_factura pf ON f.id_factura = pf.id_factura
    WHERE pf.codigo_forma_pago != '1'
      AND f.fecha_generacion < %s
      AND fc.eventos_dian_notif LIKE '%%031%%'
    GROUP BY anio, mes
    ORDER BY anio DESC, mes DESC

  # Total general por tipo de alerta (sin agrupar por fecha)
  resumen_totales: >
    SELECT
      COUNT(*) FILTER (
        WHERE fc.eventos_dian_notif IS NULL OR fc.eventos_dian_notif NOT LIKE '%%030%%'
      ) AS sin_030,
      COUNT(*) FILTER (
        WHERE fc.eventos_dian_notif IS NULL OR fc.eventos_dian_notif NOT LIKE '%%032%%'
      ) AS sin_032,
      COUNT(*) FILTER (
        WHERE fc.eventos_dian_notif IS NULL OR fc.eventos_dian_notif NOT LIKE '%%033%%'
      ) AS sin_033,
      COUNT(*) FILTER (
        WHERE fc.eventos_dian_notif LIKE '%%031%%'
      ) AS con_rechazo
    FROM facturacion.factura f
    JOIN facturacion.factura_control fc ON f.id_factura = fc.id_factura
    JOIN facturacion.pago_factura pf ON f.id_factura = pf.id_factura
    WHERE pf.codigo_forma_pago != '1'
      AND f.fecha_generacion < %s
