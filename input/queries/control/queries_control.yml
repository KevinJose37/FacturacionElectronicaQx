# ──────────────────────────────────────────────
# Queries SQL para el módulo de Control de Facturas
# ──────────────────────────────────────────────

control:
  listar: >
    SELECT
        fc.id_control,
        fc.fecha_admision_proveedor,
        fc.medio_recepcion,
        fc.fecha_entrega_contabilidad,
        fc.nombre_recibe_contabilidad,
        fc.nit_proveedor,
        fc.nombre_proveedor,
        fc.numero_factura,
        fc.forma_pago,
        fc.acuso_recibido,
        fc.recibido_bien_servicio,
        fc.aceptacion_expresa,
        fc.observaciones_entrega,
        ac.uri_almacenamiento as s3_key,
        f.id_factura
    FROM facturacion.factura f
    JOIN facturacion.factura_control fc ON f.id_factura = fc.id_factura
    LEFT JOIN facturacion.adjuntos_correo ac ON f.adjunto_id = ac.adjunto_id
    WHERE f.fecha_generacion::date BETWEEN %s AND %s
    ORDER BY f.fecha_creacion DESC
    LIMIT %s OFFSET %s

  obtener_adjuntos: >
    SELECT 
        ac.uri_almacenamiento,
        ac.id_tipo_archivo,
        ac.nombre_archivo
    FROM facturacion.adjuntos_correo ac
    WHERE ac.correo_id = (
        SELECT correo_id 
        FROM facturacion.adjuntos_correo 
        WHERE adjunto_id = (
            SELECT adjunto_id 
            FROM facturacion.factura 
            WHERE id_factura = %s
        )
    )
    ORDER BY ac.id_tipo_archivo

  contar: >
    SELECT COUNT(*)
    FROM facturacion.factura f
    JOIN facturacion.factura_control fc ON f.id_factura = fc.id_factura
    WHERE f.fecha_generacion::date BETWEEN %s AND %s

  actualizar: >
    UPDATE facturacion.factura_control
    SET fecha_entrega_contabilidad = %s,
        nombre_recibe_contabilidad = %s,
        forma_pago = %s,
        acuso_recibido = %s,
        recibido_bien_servicio = %s,
        aceptacion_expresa = %s,
        observaciones_entrega = %s,
        fecha_actualizacion = NOW()
    WHERE id_control = %s
