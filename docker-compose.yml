services:
  # ── Base de Datos ──
  database:
    image: postgres:15-alpine
    container_name: facturacion_db
    restart: unless-stopped
    networks:
      - backend_net
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./modelo_facturacion_gpt.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ── Antivirus ──
  clamav:
    image: clamav/clamav:latest
    container_name: facturacion_clamav
    restart: unless-stopped
    networks:
      - backend_net
    ports:
      - "3310:3310"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "3310" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Backend API ──
  api:
    build: .
    container_name: facturacion_api
    restart: unless-stopped
    networks:
      - backend_net
      - nginx-proxy
    depends_on:
      database:
        condition: service_started
      clamav:
        condition: service_healthy
    expose:
      - "8888"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - RUTA_CA_CONFIABLE_XML_DSIG=input/credentials/ca_bundle.pem
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./input/credentials:/app/input/credentials:ro
      - ./input/credentials/s3_connection.yml:/app/input/credentials/s3_connection.yml:ro

  # ── Worker de Cola ──
  worker:
    build: .
    restart: unless-stopped
    networks:
      - backend_net
    depends_on:
      database:
        condition: service_started
      clamav:
        condition: service_healthy
    deploy:
      replicas: 2
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./input/credentials:/app/input/credentials:ro
      - ./input/credentials/s3_connection.yml:/app/input/credentials/s3_connection.yml:ro
    command: [ "python", "-m", "core.python.ingesta.queue_worker" ]

  # ── Listener de Eventos DIAN ──
  dian_events_listener:
    build: .
    container_name: facturacion_dian_events
    restart: unless-stopped
    networks:
      - backend_net
    depends_on:
      database:
        condition: service_started
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - EMAIL_EVENTS_USER=${EMAIL_EVENTS_USER}
      - EMAIL_EVENTS_PASSWORD=${EMAIL_EVENTS_PASSWORD}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    command: [ "python", "-m", "core.python.ingesta.dian_events.listener" ]


  # ── Frontend ──
  frontend:
    build:
      context: ${FRONTEND_REPO:-https://github.com/KevinJose37/quipuxaiprueba.git}
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: facturacion_frontend
    restart: unless-stopped
    networks:
      - backend_net
      - nginx-proxy
    depends_on:
      - api
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${DOMAIN}

volumes:
  postgres_data:

networks:
  backend_net:
    driver: bridge
  nginx-proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy_default}
