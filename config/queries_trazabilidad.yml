# Consultas SQL para el módulo de trazabilidad (LOG_PROCESO)

obtener_siguiente_secuencia: >
  SELECT COALESCE(MAX(NUMERO_SECUENCIA), 0) + 1 as siguiente 
  FROM FACTURACION.LOG_PROCESO 
  WHERE ID_PROCESO = %s

obtener_id_estado: >
  SELECT ID_ESTADO_PROCESO 
  FROM FACTURACION.TIPO_ESTADO_PROCESO 
  WHERE CODIGO_REFERENCIA = %s
