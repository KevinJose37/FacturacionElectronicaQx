# =============================================================
# Configuración del sistema de facturación electrónica
# =============================================================

# ──────────────────────────────────────────────
# Servidor de correo IMAP
# ──────────────────────────────────────────────
email:
  host: imap.gmail.com
  port: 993
  # El usuario y la contraseña se leen de variables de entorno (EMAIL_USER, EMAIL_PASSWORD)
  carpeta: INBOX          # Bandeja a monitorear
  use_ssl: true

# ──────────────────────────────────────────────
# Cola de eventos
# ──────────────────────────────────────────────
queue:
  # "local"    → guarda events.json localmente (solo dev)
  # "postgres" → inserta en FACTURACION.EVENTO_INGESTA
  backend: postgres
  local_path: queue/events.json

# ──────────────────────────────────────────────
# Worker de cola de trabajo
# ──────────────────────────────────────────────
queue_worker:
  poll_interval_seconds: 5       # Polling cuando no hay trabajo
  max_backoff_seconds: 60        # Máximo backoff entre polls
  stuck_job_timeout_minutes: 10  # Timeout para jobs atascados
  batch_size: 10                 # Eventos por iteración
  max_reintentos: 3              # Máximo reintentos antes de FALLIDO

# ──────────────────────────────────────────────
# Almacenamiento de adjuntos
# ──────────────────────────────────────────────
downloads:
  base_path: input

# ──────────────────────────────────────────────
# Política de reintentos (IMAP)
# ──────────────────────────────────────────────
retry:
  max_attempts: 3
  backoff_base_seconds: 2   # Backoff exponencial: 2^intento segundos

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging:
  level: INFO               # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"

# ──────────────────────────────────────────────
# Cache en memoria (TTL)
# ──────────────────────────────────────────────
cache:
  default_ttl_seconds: 30

# ──────────────────────────────────────────────
# Pool de conexiones async (psycopg)
# ──────────────────────────────────────────────
database:
  pool:
    min_size: 5
    max_size: 15

# ──────────────────────────────────────────────
# Dashboard
# ──────────────────────────────────────────────
dashboard:
  capacity_max_epm: 200     # Threshold máximo de eventos por minuto
  factor_pipeline_warn: 0.9 # Factor para warning en etapa de procesamiento

# ──────────────────────────────────────────────
# Procesador de facturas
# ──────────────────────────────────────────────
invoice_processor:
  max_reintentos: 3           # Intentos máximos antes de marcar como fallido
  max_workers: 4              # Hilos concurrentes para procesar familias

# ──────────────────────────────────────────────
# Proveedores
# ──────────────────────────────────────────────
proveedores:
  umbral_activo: 90         # Tasa de validación % para estado 'active'
  umbral_revision: 70       # Tasa de validación % para estado 'review'

# ──────────────────────────────────────────────
# Configuración del LLM para el chatbot Innti
# ──────────────────────────────────────────────
llm:
  default_model: gpt-4o-mini
  timeout_seconds: 45
  max_tool_iterations: 3
  temperature: 0.4
  max_tokens: 1024

# ──────────────────────────────────────────────
# Seguridad y Antivirus
# ──────────────────────────────────────────────
security:
  clamav_host: "localhost"    # Usar localhost para mejor compatibilidad en Windows
  clamav_port: 3310
  clamav_timeout: 30          # Aumentar a 30s para dar margen a la carga inicial

# ──────────────────────────────────────────────
# Alertas del sistema
# ──────────────────────────────────────────────
alerts:
  enabled: true
  email_destinatarios:           # Direcciones que reciben correos de alertas CRITICA
    - admin@empresa.com
  smtp_host: smtp.gmail.com
  smtp_port: 465
  vencimiento_dias_alerta: 5     # Alertar N días antes del vencimiento sin aceptación


# ──────────────────────────────────────────────
# Listener de Facturas (polling IMAP)
# ──────────────────────────────────────────────
email_listener:
  poll_interval_seconds: 60       # Intervalo base entre ciclos exitosos
  max_backoff_seconds: 300        # Techo del backoff exponencial (5 min)
  jitter_max_seconds: 5           # Jitter aleatorio para evitar thundering herd

# ──────────────────────────────────────────────
# Listener de Eventos DIAN (polling IMAP)
# ──────────────────────────────────────────────
dian_events_listener:
  poll_interval_seconds: 30       # Intervalo base entre ciclos exitosos
  max_backoff_seconds: 300        # Techo del backoff exponencial (5 min)
  jitter_max_seconds: 5           # Jitter aleatorio para evitar thundering herd
  connection:
    max_attempts: 3               # Reintentos de conexión IMAP por ciclo
    backoff_base_seconds: 2       # Base exponencial para reintentos de conexión

# ──────────────────────────────────────────────
# Verificación Gráfica (PyMuPDF + IA)
# ──────────────────────────────────────────────
verificacion_grafica:
  umbral_texto_nativo: 50
  campos_criticos:
    - denominacion
    - nit_emisor
    - razon_social_emisor
    - nit_adquiriente
    - numero_factura
    - valor_total
    - cufe
  campos_deseables:
    - razon_social_adquiriente
    - valor_iva
    - numero_resolucion
  ia_habilitada: true
