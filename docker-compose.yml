services:
  # ── Base de Datos ──
  database:
    image: postgres:15-alpine
    container_name: facturacion_db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./modelo_facturacion_gpt.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ── Backend API ──
  api:
    build: .
    container_name: facturacion_api
    restart: unless-stopped
    depends_on:
      - database
    expose:
      - "8888"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}

  # ── Frontend (se clona y construye desde GitHub automáticamente) ──
  frontend:
    build:
      context: ${FRONTEND_REPO:-https://github.com/KevinJose37/quipuxaiprueba.git}
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: facturacion_frontend
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DOMAIN}
    networks:
      - default
      - nginx-proxy

volumes:
  postgres_data:

networks:
  nginx-proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy_default}
