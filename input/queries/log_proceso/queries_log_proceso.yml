# ──────────────────────────────────────────────
# Queries para el registro de procesos de ingesta
# ──────────────────────────────────────────────

insertar: >
  INSERT INTO FACTURACION.PROCESO_INGESTA
    (CORREO_ID, ID_ESTADO_PROCESO, OBSERVACIONES, FECHA_INICIO, FECHA_FIN)
  VALUES (%s, %s, %s, %s, NOW())
  RETURNING ID_PROCESO_INGESTA
