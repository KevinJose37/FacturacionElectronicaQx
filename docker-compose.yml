services:
  database:
    image: postgres:15-alpine
    container_name: facturacion_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Este script se ejecutará automáticamente la primera vez que se cree el contenedor
      - ./modelo_facturacion_gpt.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build: .
    container_name: facturacion_api
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://frontend

  frontend:
    build:
      context: ../quipuxaiprueba
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8888
    container_name: facturacion_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
