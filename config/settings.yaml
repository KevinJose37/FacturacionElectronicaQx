# =============================================================
# Configuración del sistema de facturación electrónica
# =============================================================

# ──────────────────────────────────────────────
# Servidor de correo IMAP
# ──────────────────────────────────────────────
email:
  host: imap.gmail.com
  port: 993
  # El usuario y la contraseña se leen de variables de entorno (EMAIL_USER, EMAIL_PASSWORD)
  carpeta: INBOX          # Bandeja a monitorear
  use_ssl: true

# ──────────────────────────────────────────────
# Cola de eventos
# ──────────────────────────────────────────────
queue:
  # "local"    → guarda events.json localmente (solo dev)
  # "postgres" → inserta en FACTURACION.EVENTO_INGESTA
  backend: postgres
  local_path: queue/events.json

# ──────────────────────────────────────────────
# Almacenamiento de adjuntos
# ──────────────────────────────────────────────
downloads:
  base_path: input

# ──────────────────────────────────────────────
# Política de reintentos (IMAP)
# ──────────────────────────────────────────────
retry:
  max_attempts: 3
  backoff_base_seconds: 2   # Backoff exponencial: 2^intento segundos

# ──────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────
logging:
  level: INFO               # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"

# ──────────────────────────────────────────────
# Cache en memoria (TTL)
# ──────────────────────────────────────────────
cache:
  default_ttl_seconds: 30

# ──────────────────────────────────────────────
# Pool de conexiones async (psycopg)
# ──────────────────────────────────────────────
database:
  pool:
    min_size: 5
    max_size: 15

# ──────────────────────────────────────────────
# Dashboard
# ──────────────────────────────────────────────
dashboard:
  capacity_max_epm: 200     # Threshold máximo de eventos por minuto
  factor_pipeline_warn: 0.9 # Factor para warning en etapa de procesamiento

# ──────────────────────────────────────────────
# Proveedores
# ──────────────────────────────────────────────
proveedores:
  umbral_activo: 90         # Tasa de validación % para estado 'active'
  umbral_revision: 70       # Tasa de validación % para estado 'review'

# ──────────────────────────────────────────────
# Configuración del LLM para el chatbot Innti
# ──────────────────────────────────────────────
llm:
  default_model: gpt-4o-mini
  timeout_seconds: 45
  max_tool_iterations: 3
  temperature: 0.4
  max_tokens: 1024

# ──────────────────────────────────────────────
# Procesamiento de facturas (ZIP → S3)
# ──────────────────────────────────────────────
processor:
  extensiones_permitidas:
    - .xml
    - .pdf
  s3_prefijo_zip: facturas
  s3_prefijo_extraidos: facturas_descomprimidas
  cabecera_bytes: 100

# ──────────────────────────────────────────────
# Seguridad y Antivirus
# ──────────────────────────────────────────────
security:
  clamav_host: "clamav"
  clamav_port: 3310
  clamav_timeout: 10
