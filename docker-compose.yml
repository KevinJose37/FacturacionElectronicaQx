services:
  database:
    image: postgres:15-alpine
    container_name: facturacion_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Este script se ejecutará automáticamente la primera vez que se cree el contenedor
      - ./modelo_facturacion_gpt.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build: .
    container_name: facturacion_api
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}

volumes:
  postgres_data:
