[project]
name = "facturacion-electronica"
version = "0.1.0"
description = "Proyecto de herramientas de facturación electrónica"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "psycopg2-binary>=2.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "lxml>=5.1.0",
    "python-magic-bin>=0.4.14",
    "pyclamd>=0.4.0",
    "boto3>=1.34.0",
    "PyMuPDF>=1.24.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "signxml>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=core --cov=utils --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88
target-version = ['py312']
