# ──────────────────────────────────────────────
# Queries SQL de los servicios del frontend
#
# Organizadas por servicio. Cada query usa placeholders
# {where}, {order}, {ids_...} interpolados en tiempo de ejecución.
# Los parámetros posicionales usan %s (psycopg).
#
# Esquema actual: TIPO_ESTADO_PROCESO IDs:
#   1=PENDIENTE, 2=EN_PROCESO, 3=PROCESADO, 4=ERROR, 5=FALLIDO
#
# Tabla de logs: PROCESO_INGESTA (no log_proceso)
# Nombre de emisor: FACTURA.RAZON_SOCIAL_EMISOR (no tercero.nombre_comercial)
# Tipo documento: FACTURA.CODIGO_TIPO_DOCUMENTO_DIAN (no tipo_documento)
# ──────────────────────────────────────────────

# ══════════════════════════════════════════════
# Dashboard
# ══════════════════════════════════════════════

dashboard:
  alertas_activas: >
    SELECT a.id_alerta, a.codigo_tipo_alerta, a.codigo_prioridad, 
           a.titulo, a.mensaje, a.fecha_creacion, c.remitente, c.asunto
    FROM facturacion.alerta a
    LEFT JOIN facturacion.correo_entrante c ON a.correo_id = c.correo_id
    WHERE a.resuelta = FALSE
    ORDER BY
      CASE a.codigo_prioridad
        WHEN 'CRITICA' THEN 1
        WHEN 'ALTA' THEN 2
        WHEN 'MEDIA' THEN 3
        WHEN 'BAJA' THEN 4
        ELSE 5
      END,
      a.fecha_creacion DESC
    LIMIT %s

  kpis: >
    SELECT
    COUNT(*) as processed,
    COUNT(*) FILTER (WHERE id_estado_proceso = 3) as validated,
    COUNT(*) FILTER (WHERE id_estado_proceso IN (4, 5)) as rejected,
    COUNT(DISTINCT id_tercero_emisor) as providers,
    COALESCE(SUM(valor_total), 0) as total_value,
    COALESCE((SELECT AVG(EXTRACT(EPOCH FROM (fecha_fin - fecha_inicio))) FROM facturacion.proceso_ingesta WHERE fecha_fin IS NOT NULL AND fecha_inicio >= %s AND fecha_inicio <= %s), 0.0) as avg_time
    FROM facturacion.factura
    WHERE fecha_creacion >= %s AND fecha_creacion <= %s

  etapas_flujo: >
    SELECT
    COUNT(*) as total,
    COUNT(*) FILTER (WHERE id_estado_proceso >= 2) as validacion,
    COUNT(*) FILTER (WHERE id_estado_proceso >= 3) as procesamiento,
    COUNT(*) FILTER (WHERE id_estado_proceso = 3) as erp,
    COUNT(*) FILTER (WHERE id_estado_proceso = 3) as finalizado
    FROM facturacion.factura
    WHERE fecha_creacion >= %s AND fecha_creacion <= %s

  facturas_por_proveedor: >
    SELECT f.razon_social_emisor, COUNT(*) as total
    FROM facturacion.factura f
    WHERE f.razon_social_emisor IS NOT NULL AND f.fecha_creacion >= %s AND f.fecha_creacion <= %s
    GROUP BY f.razon_social_emisor
    ORDER BY total DESC

  tendencia: >
    WITH dates AS (
      SELECT generate_series(%s::date, %s::date, '1 day'::interval)::date AS dia
    ),
    recibos AS (
      SELECT fc.fecha_admision_proveedor AS dia, COUNT(*) AS recibidas
      FROM facturacion.factura_control fc
      WHERE fc.fecha_admision_proveedor >= %s AND fc.fecha_admision_proveedor <= %s
      GROUP BY fc.fecha_admision_proveedor
    ),
    compras AS (
      SELECT f.fecha_expedicion::date AS dia, COUNT(*) AS compradas
      FROM facturacion.factura f
      WHERE f.fecha_expedicion >= %s AND f.fecha_expedicion <= %s
      GROUP BY f.fecha_expedicion::date
    ),
    procesadas AS (
      SELECT f.fecha_creacion::date AS dia, COUNT(*) AS procesadas
      FROM facturacion.factura f
      WHERE f.fecha_creacion >= %s AND f.fecha_creacion <= %s
      GROUP BY f.fecha_creacion::date
    )
    SELECT 
      d.dia,
      COALESCE(r.recibidas, 0) AS recibidas,
      COALESCE(c.compradas, 0) AS compradas,
      COALESCE(p.procesadas, 0) AS procesadas
    FROM dates d
    LEFT JOIN recibos r ON d.dia = r.dia
    LEFT JOIN compras c ON d.dia = c.dia
    LEFT JOIN procesadas p ON d.dia = p.dia
    ORDER BY d.dia

  valor_proveedor_stats: >
    SELECT f.razon_social_emisor AS name, SUM(f.valor_total) AS value
    FROM facturacion.factura f
    WHERE f.razon_social_emisor IS NOT NULL AND f.fecha_creacion >= %s AND f.fecha_creacion <= %s
    GROUP BY f.razon_social_emisor
    ORDER BY value DESC

  forma_pago_stats: >
    SELECT COALESCE(tf.descripcion, pf.codigo_forma_pago, 'No definido') AS name, COUNT(DISTINCT f.id_factura) AS value
    FROM facturacion.factura f
    LEFT JOIN facturacion.pago_factura pf ON f.id_factura = pf.id_factura
    LEFT JOIN facturacion.tipo_forma_pago tf ON pf.codigo_forma_pago = tf.codigo_forma_pago
    WHERE f.fecha_creacion >= %s AND f.fecha_creacion <= %s
    GROUP BY name
    ORDER BY value DESC

  medio_pago_stats: >
    SELECT COALESCE(tmp.descripcion, pf.codigo_medio_pago, 'No definido') AS name, COUNT(DISTINCT f.id_factura) AS value
    FROM facturacion.factura f
    LEFT JOIN facturacion.pago_factura pf ON f.id_factura = pf.id_factura
    LEFT JOIN facturacion.tipo_medio_pago tmp ON pf.codigo_medio_pago = tmp.codigo_medio_pago
    WHERE f.fecha_creacion >= %s AND f.fecha_creacion <= %s
    GROUP BY name
    ORDER BY value DESC

  eventos_dian_stats: >
    SELECT COALESCE(ted.nombre_evento, edf.codigo_evento, 'No definido') AS name, COUNT(*) AS value
    FROM facturacion.evento_dian_factura edf
    JOIN facturacion.factura f ON edf.id_factura = f.id_factura
    LEFT JOIN facturacion.tipo_evento_dian ted ON edf.codigo_evento = ted.codigo_evento
    WHERE f.fecha_creacion >= %s AND f.fecha_creacion <= %s
    GROUP BY name
    ORDER BY value DESC

  impuestos_stats: >
    SELECT COALESCE(ti.nombre, ti.descripcion, im.codigo_impuesto, 'Otros') AS name, SUM(im.valor_impuesto) AS value
    FROM facturacion.impuesto_factura im
    JOIN facturacion.factura f ON im.id_factura = f.id_factura
    LEFT JOIN facturacion.tipo_impuesto ti ON im.codigo_impuesto = ti.codigo_impuesto
    WHERE f.fecha_creacion >= %s AND f.fecha_creacion <= %s
    GROUP BY name
    ORDER BY value DESC

  ultimas_facturas: >
    SELECT f.prefijo_facturacion || '-' || f.numero_factura as num,
    f.razon_social_emisor,
    ep.descripcion as estado,
    f.fecha_expedicion,
    f.valor_total
    FROM facturacion.factura f
    JOIN facturacion.tipo_estado_proceso ep ON f.id_estado_proceso = ep.id_estado_proceso
    ORDER BY f.fecha_creacion DESC LIMIT %s

  actividad_reciente: >
    SELECT tp.descripcion as etapa,
    te.descripcion as detalle_error,
    pi.fecha_inicio,
    f.numero_factura
    FROM facturacion.proceso_ingesta pi
    JOIN facturacion.tipo_proceso tp ON pi.id_proceso = tp.id_tipo_proceso
    LEFT JOIN facturacion.tipo_error te ON pi.id_error = te.id_tipo_error
    LEFT JOIN facturacion.factura f ON pi.adjunto_id = f.adjunto_id
    ORDER BY pi.fecha_inicio DESC LIMIT %s

  tipos_documento: >
    SELECT f.codigo_tipo_documento_dian, COUNT(*)
    FROM facturacion.factura f
    WHERE f.codigo_tipo_documento_dian IS NOT NULL AND f.fecha_creacion >= %s AND f.fecha_creacion <= %s
    GROUP BY f.codigo_tipo_documento_dian
    ORDER BY COUNT(*) DESC

  heatmap_errores: >
    SELECT EXTRACT(DOW FROM fecha_creacion)::int as dia,
    EXTRACT(HOUR FROM fecha_creacion)::int as hora,
    COUNT(*) as total
    FROM facturacion.factura
    WHERE fecha_creacion >= %s AND fecha_creacion <= %s
    GROUP BY dia, hora
    ORDER BY dia, hora

  indicadores_pipeline: >
    SELECT
    COUNT(*) FILTER (WHERE fecha_fin IS NULL
    AND fecha_inicio < NOW() - INTERVAL '1 hour') as atascadas,
    COUNT(*) FILTER (WHERE fecha_fin IS NOT NULL
    AND fecha_fin - fecha_inicio < INTERVAL '5 minutes') as sla_ok,
    COUNT(*) FILTER (WHERE fecha_fin IS NOT NULL) as sla_total
    FROM facturacion.proceso_ingesta

  cola_interna: >
    SELECT COUNT(*) FROM facturacion.evento_ingesta
    WHERE id_estado = 1

  eventos_por_minuto: >
    SELECT COUNT(*) FROM facturacion.proceso_ingesta
    WHERE fecha_inicio >= NOW() - make_interval(mins => %s)

# ══════════════════════════════════════════════
# Facturas
# ══════════════════════════════════════════════

facturas:
  listar: >
    SELECT f.prefijo_facturacion || '-' || f.numero_factura as num,
    f.razon_social_emisor, ep.descripcion, f.valor_total,
    f.fecha_expedicion, f.id_estado_proceso,
    ac.uri_almacenamiento as s3_key, ac.nombre_archivo
    FROM facturacion.factura f
    JOIN facturacion.tipo_estado_proceso ep ON f.id_estado_proceso = ep.id_estado_proceso
    LEFT JOIN facturacion.factura_control fc ON f.id_factura = fc.id_factura
    LEFT JOIN facturacion.pago_factura pf ON f.id_factura = pf.id_factura
    LEFT JOIN facturacion.adjuntos_correo ac ON f.adjunto_id = ac.adjunto_id
    {where}
    ORDER BY f.fecha_creacion DESC LIMIT %s OFFSET %s

  estadisticas: >
    SELECT
    COUNT(*) as total,
    COUNT(*) FILTER (WHERE id_estado_proceso = 3) as validadas,
    COUNT(*) FILTER (WHERE id_estado_proceso IN (1, 2)) as pendientes,
    COUNT(*) FILTER (WHERE id_estado_proceso IN (4, 5)) as rechazadas,
    COALESCE(SUM(valor_total), 0) as monto
    FROM facturacion.factura

# Fragmentos de condiciones para facturas
facturas_filtros:
  estado: "f.id_estado_proceso IN ({placeholders})"
  busqueda: "(f.numero_factura ILIKE %s OR f.razon_social_emisor ILIKE %s OR f.prefijo_facturacion ILIKE %s)"

# ══════════════════════════════════════════════
# Logs
# ══════════════════════════════════════════════

logs:
  listar: >
    SELECT pi.fecha_inicio,
    tp.descripcion as etapa,
    te.descripcion as detalle_error,
    pi.observacion,
    f.numero_factura,
    c.remitente,
    c.asunto
    FROM facturacion.proceso_ingesta pi
    JOIN facturacion.tipo_proceso tp ON pi.id_proceso = tp.id_tipo_proceso
    LEFT JOIN facturacion.tipo_error te ON pi.id_error = te.id_tipo_error
    LEFT JOIN facturacion.factura f ON pi.adjunto_id = f.adjunto_id
    LEFT JOIN facturacion.correo_entrante c ON pi.correo_id = c.correo_id
    {where}
    ORDER BY pi.fecha_inicio DESC LIMIT %s

  conteos: >
    SELECT COUNT(*) as total,
    COUNT(*) FILTER (WHERE id_error IS NOT NULL) as errores,
    COUNT(*) FILTER (WHERE id_estado IN (4, 5)) as warnings
    FROM facturacion.proceso_ingesta WHERE fecha_inicio >= %s

# Fragmentos de condiciones para logs
logs_filtros:
  error: "pi.id_error IS NOT NULL"
  warn: "pi.id_estado IN (4, 5)"
  info: "pi.id_error IS NULL"
  busqueda: "(tp.descripcion ILIKE %s OR te.descripcion ILIKE %s)"

# ══════════════════════════════════════════════
# Proveedores
# ══════════════════════════════════════════════

proveedores:
  listar: >
    SELECT t.numero_documento,
    MAX(f.razon_social_emisor) as nombre_emisor,
    t.numero_documento as doc_ref,
    COUNT(f.id_factura) as total_facturas,
    COUNT(f.id_factura) FILTER (WHERE f.id_estado_proceso = 3) as validadas,
    MAX(f.fecha_creacion) as ultima_sync
    FROM facturacion.tercero t
    LEFT JOIN facturacion.factura f ON t.id_tercero = f.id_tercero_emisor
    WHERE t.id_rol_tercero = 1
    GROUP BY t.id_tercero
    ORDER BY total_facturas DESC

  estadisticas: >
    SELECT COUNT(*) as total,
    COUNT(*) FILTER (WHERE validadas * 100.0 / GREATEST(total_f, 1) >= 90) as activos,
    COALESCE(AVG(validadas * 100.0 / GREATEST(total_f, 1)), 0) as tasa_prom
    FROM (
      SELECT t.id_tercero,
      COUNT(f.id_factura) as total_f,
      COUNT(f.id_factura) FILTER (WHERE f.id_estado_proceso = 3) as validadas
      FROM facturacion.tercero t
      LEFT JOIN facturacion.factura f ON t.id_tercero = f.id_tercero_emisor
      WHERE t.id_rol_tercero = 1
      GROUP BY t.id_tercero
    ) sub

# ══════════════════════════════════════════════
# Rechazos
# ══════════════════════════════════════════════

rechazos:
  listar: >
    SELECT f.prefijo_facturacion || '-' || f.numero_factura as num,
    f.razon_social_emisor,
    te.descripcion as motivo_error,
    te.codigo_referencia as codigo_error,
    pi.fecha_inicio as fecha_rechazo,
    f.id_estado_proceso
    FROM facturacion.factura f
    LEFT JOIN facturacion.proceso_ingesta pi ON f.adjunto_id = pi.adjunto_id
      AND pi.id_error IS NOT NULL
    LEFT JOIN facturacion.tipo_error te ON pi.id_error = te.id_tipo_error
    WHERE f.id_estado_proceso IN (4, 5)
    ORDER BY pi.fecha_inicio DESC NULLS LAST

  estadisticas: >
    SELECT
    COUNT(*) FILTER (WHERE id_estado_proceso IN (4, 5) AND fecha_creacion >= %s) as rechazos_hoy,
    COUNT(*) FILTER (WHERE id_estado_proceso = 5) as severidad_alta,
    COUNT(*) as total FROM facturacion.factura

  reintentos: >
    SELECT COUNT(*) FROM facturacion.proceso_ingesta
    WHERE id_estado IN (4, 5)

  causas_frecuentes: >
    SELECT te.codigo_referencia, COUNT(*) as total
    FROM facturacion.proceso_ingesta pi
    JOIN facturacion.tipo_error te ON pi.id_error = te.id_tipo_error
    WHERE pi.id_error IS NOT NULL
    GROUP BY te.codigo_referencia ORDER BY total DESC

# ══════════════════════════════════════════════
# Validaciones
# ══════════════════════════════════════════════

validaciones:
  reglas: >
    SELECT tp.codigo_referencia as etapa,
    COUNT(*) FILTER (WHERE pi.id_error IS NULL) as passed,
    COUNT(*) FILTER (WHERE pi.id_error IS NOT NULL) as failed
    FROM facturacion.proceso_ingesta pi
    JOIN facturacion.tipo_proceso tp ON pi.id_proceso = tp.id_tipo_proceso
    GROUP BY tp.codigo_referencia
    ORDER BY (COUNT(*) FILTER (WHERE pi.id_error IS NOT NULL)) DESC
