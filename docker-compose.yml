services:
  # ── Base de Datos ──
  database:
    image: postgres:15-alpine
    container_name: facturacion_db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./modelo_facturacion_gpt.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ── Antivirus ──
  clamav:
    image: clamav/clamav:latest
    container_name: facturacion_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3310"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend API ──
  api:
    build: .
    container_name: facturacion_api
    restart: unless-stopped
    depends_on:
      database:
        condition: service_started
      clamav:
        condition: service_healthy
    expose:
      - "8888"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - RUTA_CA_CONFIABLE_XML_DSIG=input/credentials/ca_bundle.pem
      - LOG_LEVEL=WARNING
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend (se clona y construye desde GitHub automáticamente) ──
  frontend:
    build:
      context: ${FRONTEND_REPO:-https://github.com/KevinJose37/quipuxaiprueba.git}
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: facturacion_frontend
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${DOMAIN}
    networks:
      - default
      - nginx-proxy

volumes:
  postgres_data:

networks:
  nginx-proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy_default}
